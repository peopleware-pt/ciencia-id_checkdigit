name: cpp
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["cpp-v*"]
    paths: [cpp/**, test-vectors.json, .github/workflows/cpp.yml]
  pull_request:
    paths: [cpp/**, test-vectors.json, .github/workflows/cpp.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  publish:
    if: startsWith(github.ref, 'refs/tags/cpp-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match CMake project version
        run: test "${GITHUB_REF_NAME#cpp-v}" = "$(sed -nE 's/^project\(cienciaid VERSION ([0-9.]+).*/\1/p' cpp/CMakeLists.txt)"
      - run: gh release create "$GITHUB_REF_NAME" --title "C++ v${GITHUB_REF_NAME#cpp-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
