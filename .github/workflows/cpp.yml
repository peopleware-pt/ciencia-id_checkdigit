name: cpp
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["cpp-v*"]
    paths: [cpp/**, test-vectors.json, .github/workflows/cpp.yml]
  pull_request:
    paths: [cpp/**, test-vectors.json, .github/workflows/cpp.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Consume as a subproject, without fetching nlohmann/json
        shell: bash
        run: |
          cmake -S cpp/tests/consumer -B consumer-build -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer-build --config Release
          ctest --test-dir consumer-build -C Release --output-on-failure
          test ! -d consumer-build/_deps
  publish:
    if: startsWith(github.ref, 'refs/tags/cpp-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag must match CMake project version
        run: test "${GITHUB_REF_NAME#cpp-v}" = "$(sed -nE 's/^project\(cienciaid VERSION ([0-9.]+).*/\1/p' cpp/CMakeLists.txt)"
      - run: gh release create "$GITHUB_REF_NAME" --title "C++ v${GITHUB_REF_NAME#cpp-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
