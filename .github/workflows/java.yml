name: java
on:
  push:
    branches: [main]
    tags: ["java-v*"]
    paths: [java/**, test-vectors.json, LICENSE, NOTICE, .github/workflows/java.yml]
  pull_request:
    paths: [java/**, test-vectors.json, LICENSE, NOTICE, .github/workflows/java.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -q test
