name: java
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["java-v*"]
    paths: [java/**, test-vectors.json, LICENSE, NOTICE, .github/workflows/java.yml]
  pull_request:
    paths: [java/**, test-vectors.json, LICENSE, NOTICE, .github/workflows/java.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -q test
  publish:
    if: startsWith(github.ref, 'refs/tags/java-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Tag must match pom.xml version
        run: test "${GITHUB_REF_NAME#java-v}" = "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
      - run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - run: gh release create "$GITHUB_REF_NAME" --title "Java v${GITHUB_REF_NAME#java-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
