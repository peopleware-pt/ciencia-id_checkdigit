name: js
on:
  push:
    branches: [main]
    tags: ["js-v*"]
    paths: [js/**, test-vectors.json, .github/workflows/js.yml]
  pull_request:
    paths: [js/**, test-vectors.json, .github/workflows/js.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/vectors.test.js
      - run: cmp LICENSE ../LICENSE && cmp NOTICE ../NOTICE
