name: python
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["python-v*"]
    paths: [python/**, test-vectors.json, .github/workflows/python.yml]
  pull_request:
    paths: [python/**, test-vectors.json, .github/workflows/python.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: cmp LICENSE ../LICENSE && cmp NOTICE ../NOTICE
  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match pyproject.toml version
        run: test "${GITHUB_REF_NAME#python-v}" = "$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
      - run: pip install build && python -m build python/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true
      - run: gh release create "$GITHUB_REF_NAME" --title "Python v${GITHUB_REF_NAME#python-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
